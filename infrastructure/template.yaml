AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: uxie - PR review agent (webhook -> SQS FIFO -> Bedrock reviewer -> GitHub review)

Parameters:
  LogsStackName:
    Type: String
    Default: github-logs
    Description: Stack whose data lake (S3 + Glue database) this stack writes into.
  AppSecretArn:
    Type: String
    Description: 'Secrets Manager secret with {"app_id", "private_key", "webhook_secret"}.'
  BedrockModelId:
    Type: String
    Description: Bedrock inference profile id for the reviewer.
  ReviewMode:
    Type: String
    Default: context
    AllowedValues: [baseline, context, specialists]
  PriceInPerMTok:
    Type: String
    Default: "1.0"
    Description: USD per million input tokens for the chosen model (cost accounting only).
  PriceOutPerMTok:
    Type: String
    Default: "5.0"
  AlertEmail:
    Type: String
    Description: Where dead-letter alarms go.
  OtelSecretArn:
    Type: String
    Default: ""
    Description: 'Optional Secrets Manager secret {"endpoint", "headers"} for OTLP export (Grafana Cloud).'
  PostConfidence:
    Type: String
    Default: "0.9"
    Description: With verification on, findings below this confidence post only if a test proves them.
  VerifyFindings:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Queue each posted finding for sandbox verification by the local dispatcher.

Conditions:
  VerifyOn: !Equals [!Ref VerifyFindings, "true"]
  OtelOn: !Not [!Equals [!Ref OtelSecretArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: ../src
    Environment:
      Variables:
        LOG_LEVEL: INFO
        APP_SECRET_ARN: !Ref AppSecretArn

Resources:
  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: uxie-reviews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ReviewDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: uxie-reviews-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600  # 14 days

  ReviewQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: uxie-reviews.fifo
      FifoQueue: true
      VisibilityTimeout: 960  # > worker timeout so a running review isn't redelivered
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReviewDLQ.Arn
        maxReceiveCount: 3

  VerifyDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: uxie-verify-dlq
      MessageRetentionPeriod: 1209600  # 14 days

  VerifyQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: uxie-verify
      VisibilityTimeout: 1800  # a proof can take several minutes of model + sandbox time
      MessageRetentionPeriod: 345600  # 4 days: jobs wait while the local cluster is off
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt VerifyDLQ.Arn
        maxReceiveCount: 3

  # Identity for the verify dispatcher running on the local k3s cluster (outside AWS).
  # Access keys are created out of band so they never appear in stack outputs.
  DispatcherUser:
    Type: AWS::IAM::User
    Properties:
      UserName: uxie-dispatcher
      Policies:
        - PolicyName: uxie-dispatcher
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes  # KEDA reads queue depth
                Resource: !GetAtt VerifyQueue.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !If [OtelOn, [!Ref AppSecretArn, !Ref OtelSecretArn], !Ref AppSecretArn]
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt ReviewsTable.Arn

  WebhookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      Handler: lambdas.webhook_handler.lambda_handler
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          REVIEW_QUEUE_URL: !Ref ReviewQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ReviewQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AppSecretArn
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            Path: /webhook
            Method: POST

  ReviewWorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      Handler: lambdas.review_worker_handler.lambda_handler
      MemorySize: 2048
      Timeout: 900
      EphemeralStorage:
        Size: 4096  # repo snapshots land in /tmp
      Environment:
        Variables:
          REVIEWS_TABLE: !Ref ReviewsTable
          LAKE_BUCKET: !ImportValue
            Fn::Sub: "${LogsStackName}-RawArchiveBucketName"
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          REVIEW_MODE: !Ref ReviewMode
          VERIFY_QUEUE_URL: !If [VerifyOn, !Ref VerifyQueue, ""]
          POST_CONFIDENCE: !Ref PostConfidence
          OTEL_SECRET_ARN: !Ref OtelSecretArn
          PRICE_IN_PER_MTOK: !Ref PriceInPerMTok
          PRICE_OUT_PER_MTOK: !Ref PriceOutPerMTok
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReviewsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt VerifyQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref AppSecretArn
            - Effect: Allow
              Action: bedrock:InvokeModel  # Converse is authorized as InvokeModel
              Resource: "*"
            - !If
              - OtelOn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OtelSecretArn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub
                - "arn:aws:s3:::${Bucket}/processed/uxie/*"
                - Bucket: !ImportValue
                    Fn::Sub: "${LogsStackName}-RawArchiveBucketName"
      Events:
        Queue:
          Type: SQS
          Properties:
            Queue: !GetAtt ReviewQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 5  # spend cap: at most 5 reviews in flight

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A PR review failed 3 times and was dead-lettered.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ReviewDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  LakeCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: ReadUxiePrefix
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - "arn:aws:s3:::${Bucket}/processed/uxie/*"
                  - Bucket: !ImportValue
                      Fn::Sub: "${LogsStackName}-RawArchiveBucketName"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub
                  - "arn:aws:s3:::${Bucket}"
                  - Bucket: !ImportValue
                      Fn::Sub: "${LogsStackName}-RawArchiveBucketName"

  LakeCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: uxie-lake-crawler
      Role: !GetAtt LakeCrawlerRole.Arn
      DatabaseName: !ImportValue
        Fn::Sub: "${LogsStackName}-AnalyticsDatabaseName"
      TablePrefix: uxie_
      Targets:
        S3Targets:
          - Path: !Sub
              - "s3://${Bucket}/processed/uxie/reviews/"
              - Bucket: !ImportValue
                  Fn::Sub: "${LogsStackName}-RawArchiveBucketName"
          - Path: !Sub
              - "s3://${Bucket}/processed/uxie/findings/"
              - Bucket: !ImportValue
                  Fn::Sub: "${LogsStackName}-RawArchiveBucketName"
      Schedule:
        ScheduleExpression: cron(30 19 ? * SUN *)  # before github-logs' weekly report
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

Outputs:
  VerifyQueueUrl:
    Value: !Ref VerifyQueue
  WebhookUrl:
    Description: Paste this into the GitHub App's webhook URL.
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/webhook"
  ReviewQueueUrl:
    Value: !Ref ReviewQueue
  ReviewsTableName:
    Value: !Ref ReviewsTable
