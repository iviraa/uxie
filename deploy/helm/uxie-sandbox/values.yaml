sandbox:
  image: uxie-sandbox:dev
  pullPolicy: IfNotPresent
  runAsUser: 10001
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 100Mi
    requests:
      cpu: 250m
      memory: 128Mi
jobs:
  nodePath: /jobs  # where deploy/k3d.sh mounts ~/.uxie/jobs on each node
  size: 10Gi
